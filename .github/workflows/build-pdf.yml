name: Build PDF

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Allow Mermaid CLI sandbox workaround
        run: chmod +x scripts/mmdc-wrapper.sh

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended wkhtmltopdf

      - name: Install Python requirements
        run: python -m pip install -r scripts/requirements.txt

      - name: Read manifest version
        id: meta
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          version = ""
          for raw_line in Path("manifest.yaml").read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue
              if line.lower().startswith("version:"):
                  value = line.split(":", 1)[1].strip()
                  if (value.startswith('"') and value.endswith('"')) or (
                      value.startswith("'") and value.endswith("'")
                  ):
                      value = value[1:-1]
                  version = value
                  break

          if not version:
              raise SystemExit("manifest.yaml is missing a version field.")

          tag = f"v{version}"
          title = f"Explicit Software Engineering Method PDF {version}"
          out = Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(f"version={version}\ntag={tag}\ntitle={title}\n", encoding="utf-8")
          PY

      - name: Build PDF
        run: python scripts/build_pdf.py

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: explicit-software-engineering-method-pdf
          path: build/Explicit-Software-Engineering-Method_*.pdf

      - name: Release PDF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          files: build/Explicit-Software-Engineering-Method_*.pdf
          fail_on_unmatched_files: true
