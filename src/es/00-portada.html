<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <style>
    @page { size: A4; margin: 0; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #111827;
      background: #f3f4f6;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      width: 310mm;
      height: 450mm;
      display: flex;
      flex-direction: column;
      background: #f3f4f6;
    }

    .top {
      padding: 18mm 22mm 10mm 22mm;
      display: flex;
      flex-direction: column;
      gap: 4mm;
      text-align: left;
    }

    .title {
      font-size: 34pt;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.4px;
    }

    .subtitle {
      font-size: 14pt;
      max-width: 150mm;
      line-height: 1.4;
    }

    .meta {
      font-size: 13pt;
      color: #374151;
    }

    .title-band {
      background: #111827;
      color: #f9fafb;
      text-align: center;
      padding: 10mm 18mm;
      position:fixed;
      bottom: 200mm;
      z-index: 1;
      width: 100%;
    }

    /* Image block */
    .art {
      width: 100%;
      
    }

    .art img {
      width: 100%;
      object-fit: cover;
      display: block;
      position:fixed;
      bottom: 0px;
      left: 0px;
      z-index: 0;
    }

    /* Footer */
    .footer {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1.5mm;
      font-size: 12pt;
      color: #374151;
    }

    .author {
      font-weight: 600;
    }

    .spacer {
      flex: 1;
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="top">
      <div class="meta">
        Versión {{VERSION}} | Referencia normativa
      </div>

      <div class="subtitle">
        {{SUBTITLE}}
      </div>

      <div class="footer">
        <div class="author">{{AUTHOR}}</div>
        <div>Compilado {{GENERATED_AT}}</div>
      </div>
    </div>

    <div class="title-band">
      <h1 class="title">{{TITLE}}</h1>
    </div>

    <div class="spacer"></div>

    <div class="art">
      <img src="{{ART_IMAGE}}" alt="Ilustración de equilibrio de controles de ingeniería">
    </div>

  </div>
</body>
</html>
