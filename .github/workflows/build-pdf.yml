name: Build PDF

# Builds on every pull request and push. Publishes a release only for a tag
# v<version> that matches manifest.yaml, or on manual dispatch with release=true.
# See docs/release-checklist.md.

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release for the manifest version"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Manuscript consistency checks
        run: python scripts/check_manuscript.py

  build:
    needs: check
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read manifest version
        id: meta
        run: |
          version=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from build_pdf import read_manifest_version; print(read_manifest_version())")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build toolchain image
        run: docker build -t esem-build .

      - name: Build PDFs (all languages)
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          docker run --rm -v "$PWD":/work -w /work -e SOURCE_DATE_EPOCH esem-build make pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: explicit-software-engineering-method-pdf
          path: build/*.pdf
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ needs.build.outputs.version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${{ needs.build.outputs.version }}" >&2
            exit 1
          fi

      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: explicit-software-engineering-method-pdf
          path: build

      - name: Release PDF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Explicit Software Engineering Method PDF ${{ needs.build.outputs.version }}
          files: build/*.pdf
          fail_on_unmatched_files: true
